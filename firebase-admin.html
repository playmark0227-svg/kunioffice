<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>実績管理 - Firebase | KUNI OFFICE</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .firebase-admin {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .admin-header {
            background: var(--bg-dark);
            color: white;
            padding: 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        .firebase-status {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        .firebase-status.connected {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .firebase-status.disconnected {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .work-form {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .image-preview {
            max-width: 300px;
            margin-top: 1rem;
            border-radius: 8px;
            overflow: hidden;
        }
        .image-preview img {
            width: 100%;
            height: auto;
            display: block;
        }
        .works-list {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }
        .work-item-admin {
            display: grid;
            grid-template-columns: 150px 1fr auto;
            gap: 1rem;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .work-item-admin img {
            width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .work-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="firebase-admin">
        <div class="admin-header">
            <h1>実績管理（Firebase）</h1>
            <p>Firebase Firestoreを使って実績データを管理します</p>
        </div>

        <!-- Firebase接続状態 -->
        <div id="firebaseStatus" class="firebase-status disconnected">
            <strong>状態:</strong> Firebase未接続
        </div>

        <!-- 実績追加フォーム -->
        <div class="work-form">
            <h2>新しい実績を追加</h2>
            <form id="addWorkForm">
                <div class="form-group">
                    <label for="workCategory">カテゴリー *</label>
                    <select id="workCategory" required>
                        <option value="">選択してください</option>
                        <option value="photo">写真撮影</option>
                        <option value="print">印刷物</option>
                        <option value="video">映像制作</option>
                        <option value="signboard">看板</option>
                        <option value="goods">オリジナルグッズ</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="workTitle">タイトル *</label>
                    <input type="text" id="workTitle" required>
                </div>

                <div class="form-group">
                    <label for="workDescription">説明 *</label>
                    <textarea id="workDescription" required></textarea>
                </div>

                <div class="form-group">
                    <label for="workImage">画像ファイル *</label>
                    <input type="file" id="workImage" accept="image/*" required>
                    <div id="imagePreview" class="image-preview" style="display: none;"></div>
                </div>

                <div class="form-group">
                    <label for="workOrder">表示順序</label>
                    <input type="number" id="workOrder" value="1" min="1">
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="workFeatured">
                        おすすめ実績として表示
                    </label>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="workPublished" checked>
                        公開する
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">実績を追加</button>
            </form>
        </div>

        <!-- 実績一覧 -->
        <div class="works-list">
            <h2>登録済み実績</h2>
            <div id="worksList"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    
    <!-- Firebase Works Script -->
    <script src="js/firebase-works.js"></script>
    
    <script>
        // 画像プレビュー
        document.getElementById('workImage').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    preview.innerHTML = `<img src="${e.target.result}" alt="プレビュー">`;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // フォーム送信
        document.getElementById('addWorkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!window.FirebaseWorks) {
                alert('Firebaseが初期化されていません');
                return;
            }
            
            const imageFile = document.getElementById('workImage').files[0];
            if (!imageFile) {
                alert('画像を選択してください');
                return;
            }
            
            // 画像をアップロード
            const imageData = await window.FirebaseWorks.uploadImage(imageFile);
            if (!imageData) {
                alert('画像のアップロードに失敗しました');
                return;
            }
            
            // 実績データを作成
            const workData = {
                category: document.getElementById('workCategory').value,
                title: document.getElementById('workTitle').value,
                description: document.getElementById('workDescription').value,
                imageUrl: imageData.url,
                imageFileName: imageData.fileName,
                order: parseInt(document.getElementById('workOrder').value),
                featured: document.getElementById('workFeatured').checked,
                published: document.getElementById('workPublished').checked
            };
            
            // Firestoreに追加
            const workId = await window.FirebaseWorks.addWork(workData);
            
            if (workId) {
                alert('実績を追加しました！');
                document.getElementById('addWorkForm').reset();
                document.getElementById('imagePreview').style.display = 'none';
                loadWorksList();
            } else {
                alert('実績の追加に失敗しました');
            }
        });

        // 実績一覧の読み込み
        async function loadWorksList() {
            if (!window.FirebaseWorks) return;
            
            const works = await window.FirebaseWorks.loadWorks();
            const worksList = document.getElementById('worksList');
            
            if (!works || works.length === 0) {
                worksList.innerHTML = '<p>実績データがありません</p>';
                return;
            }
            
            worksList.innerHTML = '';
            
            works.forEach(work => {
                const workItem = document.createElement('div');
                workItem.className = 'work-item-admin';
                workItem.innerHTML = `
                    <img src="${work.imageUrl}" alt="${work.title}">
                    <div>
                        <strong>${work.title}</strong>
                        <p>${work.description}</p>
                        <small>カテゴリー: ${work.category} | 順序: ${work.order}</small>
                    </div>
                    <div class="work-actions">
                        <button class="btn btn-secondary btn-small" onclick="editWork('${work.id}')">編集</button>
                        <button class="btn btn-danger btn-small" onclick="removeWork('${work.id}', '${work.imageFileName}')">削除</button>
                    </div>
                `;
                worksList.appendChild(workItem);
            });
        }

        // 実績の削除
        async function removeWork(workId, imageFileName) {
            if (!confirm('この実績を削除しますか？')) return;
            
            // 画像を削除
            await window.FirebaseWorks.deleteImage(imageFileName);
            
            // 実績データを削除
            const success = await window.FirebaseWorks.deleteWork(workId);
            
            if (success) {
                alert('実績を削除しました');
                loadWorksList();
            } else {
                alert('削除に失敗しました');
            }
        }

        // Firebase接続状態の確認
        function checkFirebaseStatus() {
            const statusEl = document.getElementById('firebaseStatus');
            if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
                statusEl.className = 'firebase-status connected';
                statusEl.innerHTML = '<strong>状態:</strong> Firebase接続済み ✓';
            } else {
                statusEl.className = 'firebase-status disconnected';
                statusEl.innerHTML = '<strong>状態:</strong> Firebase未接続 ✗<br><small>js/firebase-works.js でFirebase設定を行ってください</small>';
            }
        }

        // ページ読み込み時
        document.addEventListener('DOMContentLoaded', function() {
            checkFirebaseStatus();
            loadWorksList();
        });
    </script>
</body>
</html>
